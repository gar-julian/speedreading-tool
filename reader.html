<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Speed reader</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        background: #fafafa;
        color: #222;
      }
      #title {
        font-size: 12px;
        line-height: 1.4;
        color: #666;
        margin: 0 0 10px;
        overflow-wrap: anywhere;
      }
      #stage {
        min-height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px;
        overflow: hidden;
      }
      /* Three columns: the pivot sits in the exact middle of the stage, and the
         letters before/after it hang off either side, so the red letter never moves. */
      #word {
        display: flex;
        width: 100%;
        font-size: 40px;
        font-weight: 600;
        line-height: 1.2;
        white-space: pre;
      }
      #word .before, #word .after { flex: 1 1 0; min-width: 0; overflow: hidden; }
      #word .before { text-align: right; }
      #word .after { text-align: left; }
      .pivot { color: #d33; } /* the letter your eye locks onto */
      #progress { height: 4px; background: #eee; margin: 8px 0 16px; border-radius: 2px; }
      #bar { height: 100%; width: 0; background: #d33; border-radius: 2px; }
      .row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
      button { flex: 1; padding: 10px; font-size: 14px; cursor: pointer; }
      label { font-size: 13px; }
      input[type=range] { flex: 1; min-width: 0; }
      #wpmLabel { font-size: 13px; min-width: 4.6em; text-align: right; }
      #msg { font-size: 13px; line-height: 1.4; color: #a00; }
    </style>
  </head>
  <body>
    <p id="title">Loading…</p>

    <div id="stage"><div id="word"><span class="before"></span><span class="pivot">R</span><span class="after">eady</span></div></div>
    <div id="progress"><div id="bar"></div></div>

    <div class="row">
      <button id="play">Play</button>
      <button id="restart">Restart</button>
    </div>

    <div class="row">
      <label for="wpm">Speed</label>
      <input id="wpm" type="range" min="100" max="800" step="25" value="300" />
      <span id="wpmLabel">300 wpm</span>
    </div>

    <p id="msg"></p>

    <script src="reader.js"></script>
  </body>
</html>
